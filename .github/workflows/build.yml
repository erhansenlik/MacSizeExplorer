name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build English and Turkish applications
        run: ./build.command
      - name: Test scanner
        run: ./MacSizeExplorer.app/Contents/MacOS/MacSizeExplorer --self-test
      - name: Package bilingual DMG
        run: ./package-dmg.command
      - name: Verify disk image
        run: hdiutil verify downloads/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MacSizeExplorer-macOS-DMG
          path: downloads/*.dmg
